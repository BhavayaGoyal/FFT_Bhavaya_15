<html>
    <head>
        <title>Transitions and Animations</title>
        <style>
            button{
                margin-left: 550px;
                width: 100px;
                height: 50px;
                background: rgb(246, 204, 174);
                border: none;
                border-radius: 30px;
                transition: 2s;
            }
            button:hover{
                background: rgb(229, 160, 92);
                transform: scale(1.1);
            }
            .box{
                width: 100px;
                height: 100px;
                background: rgb(139, 178, 250);
                /* animation-name: move;
                animation-delay: 1s;
                animation-timing-function: ease;
                animation-duration: 2s;
                animation-iteration-count: infinite; */
                animation: move 1s ease alternate infinite;
            }
            @keyframes move{
                to{
                    transform: scale(0);
                }
                from{
                    transform: scale(300px);
                }
            }
            .load{
                width: 200px;
                height: 100px;
                border: 5px solid salmon;
                border-radius: 50%;
                border-top: 5px solid black;
                animation: spin 0.9ms linear infinite;
            }
            @keyframes spin{
                from{
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <h1>Transitions and Animations</h1>
        <button>Action</button><br><br>
        <div class="box"></div><br><br>
        <div class="load"></div>
    </body>
</html>
