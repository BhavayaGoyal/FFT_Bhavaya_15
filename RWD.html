<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWD</title>
    <style>
        h1{
            background: violet;
        }
        p{
            background: yellow;
        }
        img{
                width: 200px;
                height: 200px;
                filter:contrast(100%);
            }
        @media(max-width:600px){
            h1{
                background: turquoise;
                text-align: center;
            }
            p{

                font-size: 16px;
                text-align: justify;
                background: teal;
            }
            img{
                width: 200px;
                height: 200px;
            }
            div{
                display: flex;
            }
        }
    </style>
</head>
