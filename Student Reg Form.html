<html lang="en">
<head>
    <title>Student Registration Form</title>
    <style>
        form{
            border: 1px solid #64748b;
            box-shadow: 4px 8px 10px #94a3b8;
            width: 500px;
            margin-left: 500px;
            background-color: #e0f2fe;
            border-radius: 15px;
        }

        input{
            border: none;
        }

        label{
            padding-left: 79px;
        }

        h1{
            text-align: center;
            color: #1e3a5f;
        }

        #regId{
            width: 200px;
            height: 30px;
            margin-left: 20px;
        }

        #sname{
            width: 200px;
            margin-left: 25px;
            height: 30px;
        }

        #fname{
            width: 200px;
            margin-left: 23px;
            height: 30px;
        }

        #dob{
            width: 200px;
            margin-left: 30px;
            height: 30px;
        }

        #email{
            width: 200px;
            margin-left: 18px;
            height: 30px;
        }

        #no{
            width: 200px;
            margin-left: 5px;
            height: 30px;
        }

        #address{
            margin-left: 59px;
            width: 200px;
            height: 30px;
            border: none;
        }

        #dep{
            width: 200px;
            margin-left: 32px;
            height: 30px;
        }

        #doc{
            width: 200px;
            margin-left: 33px;
            height: 30px;
        }

        #button1{
            margin-left: 170px;
            height: 30px;
            margin-bottom: 30px;
            width: 80px;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            border: none;
        }

        #button2{ 
            height: 30px;
            width: 80px;
            border-radius: 8px;
            background-color: #64748b;
            color: white;
            border: none;
        }

        #button1:hover{
            background-color: #1d4ed8;
        }

        #button2:hover{
            background-color: #475569;
        }
        
    </style>
</head>

<body>

    <form>

       <h1>Student Registration Form</h1>

       <label>Registration Id: </label> 
       <input type="number" id="regId" required placeholder="Enter Your Registration Id"><br><br>

       <label>Student Name: </label>
       <input type="text" id="sname"><br><br>

       <label>Father's Name: </label>
       <input type="text" id="fname"><br><br>

       <label>Date of Birth:</label>
       <input type="date" id="dob"><br><br>

       <label>Gender:</label>
       <input type="radio" name="gender"> Male 
       <input type="radio" name="gender"> Female 

       <br><br>

       <label>Email Address:</label>
       <input type="email" id="email"> <br><br>

       <label>Contact Number:</label>
       <input type="tel" id="no"><br><br>

       <label>Address:</label>
       <textarea id="address">   </textarea><br><br>

       <label>Department:</label>
       <input type="text" id="dep"><br><br>

       <label>Documents:</label>
       <input type="file" id="doc"><br><br>

       <input type="submit" value="Submit" id="button1">
       <input type="reset" id="button2" value="Reset">

    </form>

</body>
</html>
