<html>
    <head>
        <title>CSS Grid</title>
        <style>
            .parent{
                width: 100%;
                background: rgb(245, 184, 162);
                display: grid;
                grid-template-columns: 10% 20% 30% 5% 30%;
            }
            div{
                background:rgb(160, 241, 160);
                margin:5px;
                
            }
        </style>
    </head>
    <body>
        <h1>CSS GRID</h1>
        <div class="parent">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div>
    </body>
</html>
