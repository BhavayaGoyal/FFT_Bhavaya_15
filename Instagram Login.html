<html>
<head>
    <title>Instagram Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: white;
            min-height: 100vh;
        }

        .facebook-logo {
            width: 76px;
            height: 76px;
            background-color: #0866e9;
            border-radius: 50%;
            color: white;
            font-size: 70px;
            font-weight: bold;
            line-height: 90px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 682px;
            margin: 102px auto 0;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 75px;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            padding: 21px;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .loginButton {
            width: 100%;
            height: 55px;
            margin-top: 15px;
            border: none;
            border-radius: 30px;
            background-color: #0866e9;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .loginButton:hover{
            background-color: #041c3a;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 29px;
            color: #000;
            text-decoration: none;
            font-size: 20px;
        }

        .forgot:hover {
            text-decoration: underline;
        }
        .createButton {
            width: 100%;
            height: 56px;
            margin-top: 40px;
            border: 1px solid #0866e9;
            border-radius: 30px;
            background-color: white;
            color: #0866e9;
            font-size: 20px;
            cursor: pointer;
        }
        .createButton:hover {
            background-color: #f0f2f5;
        }
        
    </style>
</head>

<body>


    <div class="login">

        <h2>Log in to Instagram</h2>
        <input type="text" placeholder="Email address or mobile number">
        <input type="password" placeholder="Password">
        <button class="loginButton">Log in</button>
        <a href="#" class="forgot">Forgotten password?</a>
        
        <button class="createButton">Login With Facebook</button><br><br>
        <button class="createButton">Create new account</button><br><br>
    </div>

</body>
</html>
