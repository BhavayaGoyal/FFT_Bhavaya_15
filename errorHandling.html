<!-- try {
  // Code that might throw an error
} catch (error) {
  // Code to run if an error happens
} finally {
  // Optional: Code that ALWAYS runs, regardless of an error
} -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Handling</title>
</head>
<body>
    <h1>Error Handling</h1>
    <script>
        try {
            let sum = 10+10;
            console.log(sum);
        } catch (error) {
            console.log("An error occurred but it is handled ");
        } finally {
            document.write("This code is running!!!")
        }
    </script>
</body>
</html>
