<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <h1>Functions</h1>
    <script>
        // Normal function
        function Greet() {
          document.write("I m function ")  
        };
        function Sum(a,b){
            // var a =10;
            // var b = 10;
            // document.writeln(a+b)
            document.write(a+b)
        }
        const add = function(a, b) {
            document.write(" ", a + b);
        }; 
        Greet();
        Sum(1,2);
        add(2, 3); 
    </script>
</body>
</html>
<!-- If we don't give any parameters in the function calling then output will be NaN -->
